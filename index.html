<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLER 10</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <main>
        <section id="login" hidden>
            <h1>Inicio de sesion</h1>
            <p>Inicia sesion con DummyJSON</p>

            <form action="" id="login-form">
                <label for="username">Usuario</label>
                <input type="text" name="username" id="username" placeholder="emilys" autocomplete="username">

                <label for="current-password">Contrasenia</label>
                <input type="password" name="current-password" id="current-password" autocomplete="current-password">
                <p id="login-error" hidden>ERRIOR</p>
                <button id="login-btn" type="submit">Entrar</button>
            </form>

        </section>
        
        <section id="dashboard" hidden>
            <img id="foto" src="" alt="">
            <p id="nombre"></p>
            <p id="correo"></p>
            <p id="edad"></p>
            <p id="telefono"></p>
            <p id="ciudad"></p>

            <button id="cerrar-sesion" type="button">Cerrar sesión</button>

            <div id="tareas">
                <h2>Tareas</h2>

                <div id="contadores">
                    <p>Total: <span id="contador-total">0</span></p>
                    <p>Completadas: <span id="contador-completadas">0</span></p>
                    <p>Pendientes: <span id="contador-pendientes">0</span></p>
                    <p>Avance: <span id="contador-porcentaje">0%</span></p>
                </div>

                <select id="filtro">
                    <option value="todas">Todas</option>
                    <option value="pendientes">Pendientes</option>
                    <option value="completadas">Completadas</option>
                </select>

                <input type="search" id="buscador" placeholder="Buscar tarea…">
                
                <form id="form-agregar">
                    <input type="text" id="nueva-tarea" placeholder="Nueva tarea">
                    <button type="submit">Agregar</button>
              
                </form>
                <ul id="lista"></ul>
            </div>
        </section>
    </main>


    <script src="app.js"></script>
</body>

</html>
